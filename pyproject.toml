[project]
name = "deepresearch"
version = "0.1.0"
description = "Production-grade RAG for academic research, built eval-first"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",
    "boto3>=1.40",
    "python-dotenv>=1.0",
    "sqlalchemy>=1.4.36,<2.0",
    "psycopg2-binary>=2.9",
    "httpx>=0.27",
    "pydantic>=2",
    "pydantic-settings>=2",
    "alembic>=1.13",
    "python-dateutil>=2.9",
    "rapidfuzz>=3.0",
    "opensearch-py>=3.2.0",
    "langgraph>=1.2.11",
    "langfuse>=4.14.4",
]

[project.optional-dependencies]
parse = [
    "docling>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "jupyter>=1.1",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src"]
